[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "link-studio"
dynamic = ["version"]
description = "Linux control panel for the Insta360 Link 2 webcam"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luke McCann" }]
keywords = ["insta360", "webcam", "v4l2", "linux", "qt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = ["PySide6>=6.11"]

[project.optional-dependencies]
dev = ["build>=1.3", "pytest>=9.1", "pytest-qt>=4.5", "pytest-cov>=7.1", "ruff>=0.16", "mypy>=2.3", "pip-audit>=2.10"]

[project.scripts]
link-studio = "link_studio.app:main"

[tool.setuptools.dynamic]
version = { attr = "link_studio.__version__" }

[tool.setuptools.packages.find]
include = ["link_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["link_studio"]
branch = true
omit = ["link_studio/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "RET", "PTH", "PL", "RUF", "ERA", "D"]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D203", "D213", "D205", "D400", "D415",
    "PLR2004", "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "PLC0415"]
"tests/test_v4l2.py" = ["D", "E501"]
"link_studio/app.py" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["link_studio", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "shiboken6.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["pytestqt.*"]
ignore_missing_imports = true
