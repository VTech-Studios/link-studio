name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0

      - name: Install the package and development tools
        run: pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check link_studio tests scripts
          ruff format --check link_studio tests scripts

      - name: Type check
        run: mypy

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov

      - name: Audit dependencies
        run: pip-audit --local
